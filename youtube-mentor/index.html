<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentor do YouTube</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Mentor do YouTube</h1>
      <p class="muted">Digite o que você quer aprender. Eu monto um curso completo, em etapas, com as melhores aulas em português.</p>
    </header>

    <form id="form" class="panel">
      <label>
        O que você quer aprender?
        <input id="topic" type="text" placeholder="ex.: rebocar uma parede" autocomplete="off" required>
      </label>
      <label>
        Chave da YouTube Data API
        <input id="apiKey" type="password" placeholder="cole sua chave" autocomplete="off" required>
        <small class="muted">Fica salva só no seu navegador. Cada curso usa cerca de 600 unidades da cota diária gratuita (10.000).</small>
      </label>
      <button id="submit" type="submit">Montar curso</button>
      <p id="status" role="status"></p>
    </form>

    <div id="course"></div>
  </main>

  <script src="mentor.js"></script>
  <script src="app.js"></script>
</body>
</html>
